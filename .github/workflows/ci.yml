name: Shared OBS plugin CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hyperdsp-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: myrqyry/obs-plugin-ci/.github/workflows/build.yml@e9eb704437e606721ee92d7d064c4b8168fd8f53
    with:
      module: hyperdsp
      profile: full
      driver: caller
      minimum-tests: 59
      source-package: true
